name: Secrets demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    env:
      APP_ENV: ${{ vars.APP_ENVIRONMENT }}
    steps:
      - name: Variables are visible
        run: echo "Deploying to $APP_ENV"

      - name: Secrets are masked
        env:
          TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          echo "Token length: ${#TOKEN}"
          echo "Trying to print it: $TOKEN"

      - name: maksing is not encryption
        env:
          TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: echo $TOKEN | rev